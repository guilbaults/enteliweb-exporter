name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lint dependencies
        run: pip install -r requirements-lint.txt

      - name: Run flake8
        run: flake8 --max-line-length=120 enteliweb-exporter.py
